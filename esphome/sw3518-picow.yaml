# SW3518 charger meter — Raspberry Pi Pico W + ESPHome (native HA API).
# Pins match env:picow / docs/wiring-solder-guide-picow.png
#
#   cp secrets.yaml.example secrets.yaml
#   esphome run sw3518-picow.yaml
#
# First flash: hold Pico BOOT, plug USB, then esphome run (UF2). Later: OTA.

esphome:
  name: sw3518-picow
  friendly_name: SW3518 Pico W

rp2040:
  board: rpipicow

logger:
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 100kHz
  id: i2c_bus

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19
  # no MISO — ST7735 is write-only

sw3518:
  id: charger
  address: 0x3C
  update_interval: 1s

sensor:
  - platform: sw3518
    vin:
      name: Input voltage
      id: vin
    vout:
      name: Output voltage
      id: vout
    current_c:
      name: USB-C current
      id: ic
    current_a:
      name: USB-A current
      id: ia
    power:
      name: Total power
      id: power
    power_c:
      name: USB-C power
      id: power_c
    power_a:
      name: USB-A power
      id: power_a
  - platform: integration
    name: Session energy
    id: session_wh
    sensor: power
    time_unit: h
    restore: false
    unit_of_measurement: Wh
    device_class: energy
    state_class: measurement

text_sensor:
  - platform: sw3518
    protocol:
      name: Charge protocol
      id: protocol

binary_sensor:
  - platform: sw3518
    linked:
      name: SW3518 linked
      id: linked
    charging:
      name: Charging
      id: charging
  - platform: gpio
    pin:
      number: GPIO6
      inverted: true
      mode:
        input: true
        pullup: true
    id: btn_a
    name: Button A
    internal: true
    on_press:
      then:
        - lambda: |-
            id(ui_page) = (id(ui_page) + 1) % 2;
        - output.turn_on: haptic_out
        - delay: 40ms
        - output.turn_off: haptic_out
        - component.update: tft
  - platform: gpio
    pin:
      number: GPIO7
      inverted: true
      mode:
        input: true
        pullup: true
    id: btn_b
    name: Button B
    internal: true
    on_multi_click:
      - timing:
          - ON for at most 0.5s
        then:
          - lambda: "id(ui_page) = 1;"
          - component.update: tft
      - timing:
          - ON for at least 0.8s
        then:
          - sensor.integration.reset: session_wh
          - output.turn_on: haptic_out
          - delay: 80ms
          - output.turn_off: haptic_out

output:
  - platform: rp2040_pwm
    pin: GPIO21
    id: tft_bl
    frequency: 1000Hz
  - platform: gpio
    pin: GPIO9
    id: haptic_out

light:
  - platform: monochromatic
    output: tft_bl
    name: TFT backlight
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

globals:
  - id: ui_page
    type: int
    restore_value: false
    initial_value: "0"

font:
  - file: "gfonts://Roboto"
    id: font12
    size: 12
  - file: "gfonts://Roboto"
    id: font22
    size: 22

color:
  - id: col_white
    hex: FFFFFF
  - id: col_grey
    hex: AAAAAA
  - id: col_cyan
    hex: 00FFFF
  - id: col_yellow
    hex: FFFF00
  - id: col_orange
    hex: FF8000

display:
  - platform: ili9xxx
    id: tft
    model: ST7735
    cs_pin: GPIO17
    dc_pin: GPIO16
    reset_pin: GPIO20
    dimensions:
      width: 128
      height: 128
    invert_colors: false
    color_order: bgr
    color_palette: 8BIT
    data_rate: 8MHz
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      char buf[32];
      const bool on_ses = id(ui_page) != 0;
      it.print(2, 2, id(font12), id(col_cyan), "SW3518");
      it.print(70, 2, id(font12), id(col_grey), on_ses ? "SES" : "MAIN");
      if (!id(linked).state) {
        it.print(4, 56, id(font12), id(col_orange), "SW3518 missing");
        return;
      }
      if (!on_ses) {
        snprintf(buf, sizeof(buf), "%.1f W", id(power).has_state() ? id(power).state : 0);
        it.print(8, 28, id(font22), id(col_white), buf);
        snprintf(buf, sizeof(buf), "Vin %.1f  Vout %.2f",
                 id(vin).has_state() ? id(vin).state : 0,
                 id(vout).has_state() ? id(vout).state : 0);
        it.print(4, 58, id(font12), id(col_grey), buf);
        snprintf(buf, sizeof(buf), "C %.2fA  A %.2fA",
                 id(ic).has_state() ? id(ic).state : 0,
                 id(ia).has_state() ? id(ia).state : 0);
        it.print(4, 74, id(font12), id(col_yellow), buf);
        if (id(protocol).has_state())
          it.print(4, 94, id(font12), id(col_white), id(protocol).state.c_str());
        it.print(4, 112, id(font12), id(col_grey), id(charging).state ? "LIVE" : "IDLE");
      } else {
        it.print(4, 24, id(font12), id(col_cyan), "SESSION");
        snprintf(buf, sizeof(buf), "%.3f Wh", id(session_wh).has_state() ? id(session_wh).state : 0);
        it.print(4, 48, id(font22), id(col_orange), buf);
        snprintf(buf, sizeof(buf), "%.1f W now", id(power).has_state() ? id(power).state : 0);
        it.print(4, 80, id(font12), id(col_white), buf);
        it.print(4, 112, id(font12), id(col_grey), "hold B = clear");
      }
