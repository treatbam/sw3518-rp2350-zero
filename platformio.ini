; Portable SW3518 USB charger meter — Waveshare RP2350-Zero + 1.8" ST7735
; Core: earlephilhower Arduino-Pico via maxgerhardt PlatformIO platform
;
; Board id: waveshare_rp2350_zero (earlephilhower). If your platform package
; lacks that id, try: waveshare_rp2350_pizero or rpipico2 and note in README.

[env:rp2350-zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
upload_protocol = picotool
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
build_flags =
  -DUSBCON
  -DARDUINO_USB_CDC_ON_BOOT=1


; Wokwi sim twin — official Wokwi has Pico (RP2040), not RP2350 yet.
; Same GPIO numbers as the Zero pin map; fake SW3518 via -DWOKWI_SIM=1.
[env:pico-wokwi]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
build_flags =
  -DWOKWI_SIM=1
  -DUSBCON
  -DARDUINO_USB_CDC_ON_BOOT=1
